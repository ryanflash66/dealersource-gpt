name: dealersource-daily
description: Discover, verify, score, and report Eastern North Carolina dealership sites.
schedule:
  cron: "0 5 * * *"
  timezone: America/New_York
repository:
  checkout: main
command: pnpm pipeline
prompt: >-
  Run the dealersource pipeline. Use only configured providers and approved message templates.
  Extract listing fields, classify inbound replies, and write the digest during this run.
  Never compose new outreach questions, negotiate, make offers, sign, pay, or use a non-email channel.
  Stop outbound sending on Gmail quota errors or when the rolling 24-hour bounce rate exceeds configuration.
success:
  requires:
    - six stages complete
    - run summary persisted
    - dashboard report updated
