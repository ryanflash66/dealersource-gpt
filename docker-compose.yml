services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dealersource
      POSTGRES_USER: dealersource
      POSTGRES_PASSWORD: dealersource_local_only
    ports:
      - "54322:5432"
    volumes:
      - dealersource_postgres:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealersource -d dealersource"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dealersource_postgres:
